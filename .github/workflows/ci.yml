name: CI

on:
  push:
    branches: [main]
    tags: ['api-v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: platform_owner
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: platform
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U platform_owner -d platform"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run lint-imports
      - run: uv run alembic upgrade heads
      - run: uv run pytest -v
      - run: uv run python scripts/export_openapi.py --check

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/unif-code/engineering-platform-backend:${{ steps.meta.outputs.tag }}
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "ghcr.io/unif-code/engineering-platform-backend:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/unif-code/engineering-platform-backend@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/api-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          V=$(uv run python -c "from control_plane.app import __version__; print(__version__)")
          [ "$TAG" = "api-v$V" ] || { echo "tag $TAG != api-v$V" >&2; exit 1; }
      - run: uv run python scripts/export_openapi.py --check
      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 openapi.json > openapi.json.sha256
          gh release create "$TAG" openapi.json openapi.json.sha256 --title "$TAG" --notes "OpenAPI Artifact $TAG" \
            || gh release upload "$TAG" openapi.json openapi.json.sha256 --clobber
