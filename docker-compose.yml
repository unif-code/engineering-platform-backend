services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: platform
    ports:
      - '5432:5432'
    # postgres:18 的 PGDATA 为 /var/lib/postgresql/18/docker，镜像声明的卷是其父目录
    # /var/lib/postgresql（不再是旧版的 /var/lib/postgresql/data），挂父目录才能真正持久化。
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform_owner -d platform']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
