services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: platform
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform_owner -d platform']
      interval: 2s
      timeout: 3s
      retries: 20
