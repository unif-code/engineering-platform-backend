  "control_plane.app.modules.organization.api",
  "control_plane.app.modules.organization.application",
  "control_plane.app.modules.organization.domain",
  "control_plane.app.modules.organization.ports",
  "control_plane.app.modules.organization.adapters",
  "control_plane.app.modules.workspace.api",
  "control_plane.app.modules.workspace.application",
  "control_plane.app.modules.workspace.domain",
  "control_plane.app.modules.workspace.ports",
  "control_plane.app.modules.workspace.adapters",
  "control_plane.app.modules.authorization.api",
  "control_plane.app.modules.authorization.application",
  "control_plane.app.modules.authorization.domain",
  "control_plane.app.modules.authorization.ports",
  "control_plane.app.modules.authorization.adapters",
  "control_plane.app.modules.requirement.api",
  "control_plane.app.modules.requirement.application",
  "control_plane.app.modules.requirement.domain",
  "control_plane.app.modules.requirement.ports",
  "control_plane.app.modules.requirement.adapters",
  "control_plane.app.modules.source_control.api",
  "control_plane.app.modules.source_control.application",
  "control_plane.app.modules.source_control.domain",
  "control_plane.app.modules.source_control.ports",
  "control_plane.app.modules.source_control.adapters",
