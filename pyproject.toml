[project]
name = "engineering-platform-backend"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1",
  "cryptography>=44.0",
  "fastapi>=0.115",
  "pyotp>=2.9",
  "uvicorn>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.9",
  "mypy>=1.14",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "control_plane/app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["control_plane", "migrations", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: 需要真实 PostgreSQL"]
# 上游告警：starlette 1.x 的 TestClient 期望 httpx2，与本仓锁定的 httpx 组合触发，非本仓代码问题。
filterwarnings = [
  'ignore:Using `httpx` with `starlette\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning',
]

[tool.importlinter]
root_packages = ["control_plane"]

[[tool.importlinter.contracts]]
name = "模块分层单向：api → adapters → application → ports → domain"
type = "layers"
# adapters 置于 api 之下、application 之上：允许 api 边缘装配 adapters，
# 禁止 application/ports/domain 反向依赖 adapters。
layers = ["api", "adapters", "application", "ports", "domain"]
containers = [
  "control_plane.app.modules.identity",
  "control_plane.app.modules.audit",
  "control_plane.app.modules.organization",
  "control_plane.app.modules.workspace",
  "control_plane.app.modules.authorization",
  "control_plane.app.modules.configuration",
  "control_plane.app.modules.requirement",
  "control_plane.app.modules.source_control",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "identity 不得进入 audit 内部（仅公开 Facade）"
type = "forbidden"
source_modules = ["control_plane.app.modules.identity"]
forbidden_modules = [
  "control_plane.app.modules.audit.api",
  "control_plane.app.modules.audit.application",
  "control_plane.app.modules.audit.domain",
